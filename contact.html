<!-- Contact Form -->

<section class="bg-white">

    <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">

        <h2 class="mb-4 text-4xl tracking-tight font-extrabold text-center text-black">
            Contact Us
        </h2>

        <p class="mb-8 lg:mb-16 font-light text-center text-gray-600 sm:text-xl">
            Got a technical issue? Want to send feedback about a beta feature?
            Need details about our Business plan? Let us know.
        </p>

        <form action="#" class="space-y-8">

            <div>
                <label for="email" class="block mb-2 text-sm font-medium text-black">
                    Your email
                </label>

                <input type="email" id="email"
                    class="bg-white border border-gray-400 text-black text-sm rounded-lg block w-full p-2.5"
                    placeholder="name@example.com" required>
            </div>


            <div>
                <label for="subject" class="block mb-2 text-sm font-medium text-black">
                    Subject
                </label>

                <input type="text" id="subject"
                    class="block p-3 w-full text-sm text-black bg-white rounded-lg border border-gray-400"
                    placeholder="Let us know how we can help you" required>
            </div>


            <div>
                <label for="message" class="block mb-2 text-sm font-medium text-black">
                    Your message
                </label>

                <textarea id="message" rows="6"
                    class="block p-2.5 w-full text-sm text-black bg-white rounded-lg border border-gray-400"
                    placeholder="Leave a comment..."></textarea>
            </div>


            <button type="submit"
                class="py-3 px-5 text-sm font-medium text-center text-white rounded-lg bg-green-700 hover:bg-green-900">
                Send message
            </button>

        </form>

    </div>

</section>
